services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: votoscope
      POSTGRES_PASSWORD: votoscope
      POSTGRES_DB: votoscope
    ports:
      # 5433 because the machine already has a postgres listening on 5432
      - "5433:5432"
    volumes:
      # Postgres 18 keeps PGDATA in /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votoscope -d votoscope"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
