# Party catalogue: canonical electoral brands.
# Keys are canonical `silver.party` slugs; `name` and `aliases` are literal
# spellings as ingested (or as the polls source publishes them). Spellings
# that coincide after normalization need no alias.
#
# Curation decisions (reviewable in this diff):
# - Punctuation pairs (B.N.G./BNG, P.P./PP, C's/Cs, I.U./IU...) merge through
#   normalization alone: the clean spelling of the brand is canonical.
# - Distinct spellings of the same brand merge only with an explicit alias
#   (Junts, PNV, Adelante Andalucía (2021), UNIDOS PODEMOS).
# - Coalitions with their own name stay separate (Podemos / Unidas Podemos /
#   Sumar); green, falange and ERC splinters stay separate too, because their
#   spellings are distinct brands, not punctuation variants.
# - A spelling that coincides with its own ficha's slug needs no alias (SALF,
#   Aliança.cat): every ficha resolves through its slug key.

[parties.3e]
name = "3e"

[parties.adelante-andalucia]
# (2021) is the label of the polls source; the literal of file 03 is undated.
name = "ADELANTE ANDALUCÍA"
color = "#00a651"
aliases = ["Adelante Andalucía (2021)"]

